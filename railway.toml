# railway.toml
# Deploy backend to Railway
# railway.app → New Project → Deploy from GitHub → Root: /backend

[build]
builder = "nixpacks"
buildCommand = "npm ci && npm run build"

[deploy]
startCommand = "node dist/index.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Optional: run migrations on deploy
# [deploy]
# preDeployCommand = "npm run db:deploy"

[environments.production]
# Variables set in Railway dashboard (not here):
# DATABASE_URL, JWT_SECRET, CORS_ORIGIN, COOKIE_SECURE, NODE_ENV, PORT